plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "6.0.1.5171"
	id 'jacoco'
}

group = 'com.retailpulse'
version = '0.0.1-SNAPSHOT'
description = 'Payment project for Retails'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

tasks.named('bootJar') {
	archiveFileName = "spring-boot-api-${project.version}.jar"
}
tasks.named('jar') {
	enabled = false
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ELK Stack
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
	implementation "com.stripe:stripe-java:29.5.0"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'

	testImplementation 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = "0.8.11" // or latest stable
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test') // tests are required to run before generating the report
	reports {
		xml.required = true
		html.required.set(true)
		csv.required = false
		//	html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}

	classDirectories.setFrom(fileTree(dir: "$buildDir/classes/java/main", excludes: ['**/config/**', '**/dto/**']))
	sourceDirectories.setFrom(files('src/main/java'))
	executionData.setFrom(fileTree(dir: buildDir, includes: ['jacoco/test.exec', 'jacoco/test*.exec', 'jacoco/*.exec']))
}

tasks.named("jacocoTestCoverageVerification", JacocoCoverageVerification) {
	dependsOn tasks.named("test")

	violationRules {
		rule {
			limit {
				minimum = 0.10
			}
		}
	}

	classDirectories.setFrom(fileTree(dir: "$buildDir/classes/java/main", excludes: ['**/config/**', '**/dto/**']))
	sourceDirectories.setFrom(files('src/main/java'))
	executionData.setFrom(fileTree(dir: buildDir, includes: ['jacoco/test.exec', 'jacoco/test*.exec', 'jacoco/*.exec']))
}
check.dependsOn tasks.named("jacocoTestCoverageVerification")


sonar {
	properties {
		property "sonar.projectKey", "Innovations-Technology_renter_score_authentication"
		property "sonar.organization", "innovations-technology"
		property "sonar.host.url", "https://sonarcloud.io"
	}
}
