spring:
  application:
    name: Payment

  datasource:
    url: jdbc:mysql://localhost:30310/RPPaymentDB #3300
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    datasource: 
      hikari: # HikariCP Configuration
        minimum-idle: 5
        maximum-pool-size: 20
        auto-commit: true
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    user:
      name: admin
      password: admin

logging:
  level:
    root: INFO
    org:
      springframework:
        security: TRACE
    com.retailpulse: DEBUG
  file:
    name: logs/rp-sales.log