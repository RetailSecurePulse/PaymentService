sales-service:
  url: http://localhost:30085

stripe:
  apiKey: ${STRIPE_API_KEY:sk_test_51SBx0NH1LGmpXQLTMttHXOrB9QNPYnWRT5bIzS5W33eDJsX836XTfHKSkwmXFNd4Crnbqwh6XKm8Lu0yoeqdSPBt00evCK3s0C}    # recommended: override with env var
