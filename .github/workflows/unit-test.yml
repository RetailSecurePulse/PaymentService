name: Java CI with Gradle

env:
  JAVA_VERSION: '23'
  DISTRIBUTION: 'temurin'
  SNYK_ORG: retailsecurepulse

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code #checkout v6.0.2 SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 23 #setup-java v5.2.0 SHA
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle
          # actions/setup-gradle v6.1.0 SHA
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Run Tests with Gradle
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload Jacoco HTML Report #upload-artifact v7.0.1 SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-html
          path: build/reports/jacoco/test/html

      - name: Upload Jacoco XML Report #upload-artifact v7.0.1 SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml


  security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      # Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk@latest

      - name: Authenticate Snyk CLI
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source Scan
        run: snyk test --all-sub-projects --org="${SNYK_ORG}" --severity-threshold=medium
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Monitor
        run: snyk monitor --all-sub-projects --org="${SNYK_ORG}"
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.event.pull_request.head.repo.fork == false || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 23
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Cache SonarQube packages #actions/cache v5.0.5 SHA
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Check Sonar token visibility
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN is not set. Exiting."
              exit 1
          else
              echo "SONAR_TOKEN is set."
          fi

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew clean test jacocoTestReport \
          sonar --info \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.verbose=true