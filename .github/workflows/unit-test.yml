name: Java CI with Gradle

on:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Tests with Gradle
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload Jacoco HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-html
          path: build/reports/jacoco/test/html

      - name: Upload Jacoco XML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml


  security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      # Install Snyk CLI
      - uses: snyk/actions/setup@v1

      - name: Snyk Open Source Scan
        run: snyk test --all-sub-projects --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Synk Code Monitor
        run: snyk code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code Sarif
        run: snyk code test --sarif-file-output=code-report.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: code-report.sarif


  sonar:
    name: SonarQube Code Scan
    runs-on: ubuntu-latest
    needs: [test] # Ensure tests run before SonarQube analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew clean test jacocoTestReport \
          sonarqube --info \
          -Dsonar.token=$SONAR_TOKEN