apiVersion: batch/v1
kind: Job
metadata:
  name: create-payment-events-topics
  namespace: ns-retailpulse
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-service.ns-retailpulse.svc.cluster.local 9092; do
                echo "Waiting for Kafka at kafka-service:9092 to be ready..."
                sleep 3;
              done
      containers:
        - name: kafka-admin
          image: 'bitnami/kafka:3.7.0'
          command:
            - /bin/bash
            - -lc
            - |
              /opt/bitnami/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka-service.ns-retailpulse.svc.cluster.local:9092 \
              --create --if-not-exists \
              --topic payment-events \
              --partitions 3 \
              --replication-factor 1
              echo "Topic 'payment-events' ensured."