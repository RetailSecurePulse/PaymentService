apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: ns-retailpulse
  labels:
    app: kafka-ui-retailpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui-retailpulse
  template:
    metadata:
      labels:
        app: kafka-ui-retailpulse
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "retailpulse-local"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-service.ns-retailpulse.svc.cluster.local:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-service
  namespace: ns-retailpulse
  labels:
    app: kafka-ui-retailpulse
spec:
  selector:
    app: kafka-ui-retailpulse
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30095
  type: NodePort